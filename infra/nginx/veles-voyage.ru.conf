server {
    listen 80;
    listen [::]:80;
    server_name velesvoyage.ru www.velesvoyage.ru www.veles-voyage.ru;
    return 301 https://veles-voyage.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name velesvoyage.ru www.velesvoyage.ru www.veles-voyage.ru;
    ssl_certificate /etc/letsencrypt/live/veles-voyage.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/veles-voyage.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (CSP is managed by Next.js, nginx passes it through)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://veles-voyage.ru$request_uri;
}
